<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="registratsiya.css">
</head>
<body>
   <button id="openModal">Ro‘yxatdan o‘tish</button>

<div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Ro‘yxatdan o‘tish</h2>
      <form id="registerForm">
        <label>Ism:</label>
        <input type="text" id="name" placeholder="Ismingizni kiriting">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Email kiriting">

        <label>Parol:</label>
        <input type="password" id="password" placeholder="Parol kiriting">

        <label>Parolni tasdiqlash:</label>
        <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting">

        <button type="submit">Yuborish</button>

        <p id="error" class="error"></p>
        <p id="success" class="success"></p>
      </form>
    </div>
  </div>

  <script src="registratsiya.js"></script>


</body>
</html>

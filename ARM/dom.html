<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online kutubxona — Qidiruv va Filtrlash</title>
  <style>
   :root {
  --bg: linear-gradient(135deg, #f7f7fb, #eef1f9);
  --card: #ffffff;
  --text: #222;
  --muted: #666;
  --accent: #5c7cfa;
  --accent-hover: #4a63d9;
  --border: #e6e6ef;
  --shadow: rgba(0, 0, 0, 0.08);
}

body {
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

header {
  padding: 24px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 6px var(--shadow);
}

header h1 {
  margin: 0;
  font-size: 22px;
  color: var(--accent);
  font-weight: 700;
}

.container {
  max-width: 700px;
  margin: 24px auto;
  padding: 0 20px;
}

.filters {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr 1fr;
  gap: 16px;
  background: var(--card);
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 4px 12px var(--shadow);
  transition: transform 0.2s ease;
}
.filters:hover {
  transform: translateY(-2px);
}

.filters .group {
  display: grid;
  gap: 8px;
}

.filters label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.filters input[type="text"],
.filters select {
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 12px;
  background: #fff;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.filters input[type="text"]:focus,
.filters select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(92, 124, 250, 0.2);
  outline: none;
}

.subfilters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
.chip:hover {
  background: #f0f2ff;
  transform: scale(1.05);
}
.chip input { accent-color: var(--accent); }

.actions {
  margin-top: 14px;
  display: flex;
  gap: 12px;
}

.btn {
  height: 38px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  padding: 0 16px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s ease, transform 0.2s ease;
}
.btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
}
.btn-outline {
  background: #fff;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-outline:hover {
  background: var(--accent);
  color: #fff;
}

.results-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 0 10px;
}

.results-meta .count {
  color: var(--muted);
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: grid;
  gap: 8px;
  box-shadow: 0 4px 10px var(--shadow);
  transition: transform 0.2s ease;
}
.card:hover {
  transform: translateY(-4px);
}

.title {
  font-weight: 600;
  font-size: 16px;
  color: var(--accent);
}

.meta {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
}

.tag {
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 10px;
  background: #f7f8ff;
  color: var(--accent);
}

.empty {
  border: 1px dashed var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-style: italic;
}

@media (max-width: 900px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .filters { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
}

  </style>
</head>
<body>
  <header class="container">
    <h1>Online kutubxona — Qidiruv va Filtrlash</h1>
  </header>

  <main class="container">
    <!-- Qidiruv va asosiy filtrlash -->
    <section class="filters" id="filters">
      <div class="group">
        <label for="author">Muallif</label>
        <input type="text" id="author" placeholder="Masalan: Abdulla Qodiriy"/>
      </div>
      <div class="group">
        <label for="genre">Janr</label>
        <select id="genre">
          <option value="">Barchasi</option>
          <option value="Roman">Roman</option>
          <option value="She'riyat">She'riyat</option>
          <option value="Fantastika">Fantastika</option>
          <option value="Tarix">Tarix</option>
          <option value="Dramaturgiya">Dramaturgiya</option>
        </select>
      </div>
      <div class="group">
        <label for="year">Yil</label>
        <select id="year">
          <option value="">Barchasi</option>
          <option>1920</option>
          <option>1930</option>
          <option>1960</option>
          <option>1990</option>
          <option>2005</option>
          <option>2010</option>
          <option>2020</option>
          <option>2024</option>
        </select>
      </div>
      <div class="group">
        <label for="lang">Til</label>
        <select id="lang">
          <option value="">Barchasi</option>
          <option value="O'zbek">O'zbek</option>
          <option value="Rus">Rus</option>
          <option value="Ingliz">Ingliz</option>
        </select>
      </div>

      <!-- Qo'shimcha filtrlar -->
      <div class="subfilters" style="grid-column: 1 / -1;">
        <label class="chip">
          <input type="checkbox" id="onlyEbook"/> Faqat elektron (PDF/EPUB)
        </label>
        <label class="chip">
          <input type="checkbox" id="onlyAudio"/> Faqat audio (MP3)
        </label>
        <label class="chip">
          <input type="checkbox" id="onlyFree"/> Faqat bepul
        </label>
      </div>

      <!-- Harakat tugmalari -->
      <div class="actions" style="grid-column: 1 / -1;">
        <button class="btn" id="apply">Natijalarni ko‘rsat</button>
        <button class="btn btn-outline" id="reset">Tozalash</button>
      </div>
    </section>

    
  </main>

  
</body>
</html>
